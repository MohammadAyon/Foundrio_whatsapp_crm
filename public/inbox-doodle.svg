<?xml version="1.0" encoding="UTF-8"?>
<!--
  Foundrio Architectural drafting line-drawing pattern for the inbox message area.
  Tile size: 240x240, seamless repeat.
  Features subtle drafting and architectural elements:
  - Drafting compass, T-square & triangles
  - Architectural door swing / floor plan notation
  - Column grid marker / section bubble
  - Elevation marker / level symbol
  - Isometric structural frame
  - Dimension arrows & guidelines
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none" stroke="#B5472B" stroke-opacity="0.08" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  <!-- 1. Drafting Compass @ (35, 30) -->
  <g transform="translate(25 20)">
    <circle cx="16" cy="6" r="3"/>
    <path d="M16 9 L8 34"/>
    <path d="M16 9 L24 34"/>
    <path d="M11 23 L21 23"/>
    <path d="M7 34 L9 34"/>
    <path d="M23 34 L25 34"/>
  </g>

  <!-- 2. Architectural Door Swing (Floor plan detail) @ (100, 25) -->
  <g transform="translate(95 20)">
    <rect x="2" y="2" width="4" height="24"/>
    <path d="M6 26 C 20 26, 28 18, 28 6"/>
    <path d="M6 26 L28 6" stroke-dasharray="2 2"/>
  </g>

  <!-- 3. Section Callout / Grid Bubble @ (175, 30) -->
  <g transform="translate(165 20)">
    <circle cx="15" cy="15" r="12"/>
    <line x1="3" y1="15" x2="27" y2="15"/>
    <path d="M15 3 L15 15"/>
    <!-- North/Arrow indicator -->
    <path d="M15 0 L18 3 L12 3 Z" fill="#B5472B" fill-opacity="0.08"/>
  </g>

  <!-- 4. Dimension Line with Ticks @ (20, 85) -->
  <g transform="translate(15 80)">
    <line x1="5" y1="12" x2="45" y2="12"/>
    <line x1="5" y1="4" x2="5" y2="20"/>
    <line x1="45" y1="4" x2="45" y2="20"/>
    <line x1="2" y1="15" x2="8" y2="9"/>
    <line x1="42" y1="15" x2="48" y2="9"/>
  </g>

  <!-- 5. Isometric Structural Prism @ (90, 80) -->
  <g transform="translate(85 75)">
    <!-- Top face -->
    <path d="M20 5 L35 13 L20 21 L5 13 Z"/>
    <!-- Left face -->
    <path d="M5 13 L5 31 L20 39 L20 21 Z"/>
    <!-- Right face -->
    <path d="M35 13 L35 31 L20 39 L20 21 Z"/>
  </g>

  <!-- 6. 30/60 Drafting Triangle @ (160, 80) -->
  <g transform="translate(155 75)">
    <path d="M6 34 L32 34 L6 6 Z"/>
    <path d="M11 29 L23 29 L11 16 Z"/>
  </g>

  <!-- 7. Structural Column Cross-Section @ (35, 150) -->
  <g transform="translate(25 140)">
    <rect x="6" y="6" width="22" height="22"/>
    <line x1="6" y1="6" x2="28" y2="28"/>
    <line x1="28" y1="6" x2="6" y2="28"/>
  </g>

  <!-- 8. Elevation / Level Marker @ (105, 150) -->
  <g transform="translate(95 140)">
    <circle cx="16" cy="16" r="12"/>
    <!-- Crosshair quadrants -->
    <path d="M16 4 A 12 12 0 0 1 28 16 L 16 16 Z" fill="#B5472B" fill-opacity="0.08"/>
    <path d="M16 28 A 12 12 0 0 1 4 16 L 16 16 Z" fill="#B5472B" fill-opacity="0.08"/>
    <line x1="16" y1="0" x2="16" y2="32"/>
    <line x1="0" y1="16" x2="32" y2="16"/>
  </g>

  <!-- 9. T-Square / Drafting Ruler @ (170, 145) -->
  <g transform="translate(160 140)">
    <rect x="2" y="4" width="6" height="28" rx="1"/>
    <rect x="8" y="14" width="30" height="8" rx="1"/>
    <!-- Scale ticks -->
    <line x1="14" y1="14" x2="14" y2="17"/>
    <line x1="20" y1="14" x2="20" y2="18"/>
    <line x1="26" y1="14" x2="26" y2="17"/>
    <line x1="32" y1="14" x2="32" y2="18"/>
  </g>

  <!-- 10. Stair Flight Indicator (Architectural plan) @ (50, 205) -->
  <g transform="translate(45 195)">
    <line x1="0" y1="6" x2="32" y2="6"/>
    <line x1="0" y1="12" x2="32" y2="12"/>
    <line x1="0" y1="18" x2="32" y2="18"/>
    <line x1="0" y1="24" x2="32" y2="24"/>
    <!-- Walk line with arrow -->
    <line x1="16" y1="27" x2="16" y2="3"/>
    <path d="M13 6 L16 3 L19 6"/>
    <circle cx="16" cy="27" r="1.5" fill="#B5472B" fill-opacity="0.08"/>
  </g>

  <!-- 11. North Arrow @ (135, 200) -->
  <g transform="translate(125 190)">
    <circle cx="16" cy="16" r="13"/>
    <!-- North half-arrow -->
    <path d="M16 6 L21 21 L16 18 Z" fill="#B5472B" fill-opacity="0.12"/>
    <path d="M16 6 L11 21 L16 18 Z"/>
    <text x="16" y="4" font-family="monospace" font-size="6" text-anchor="middle" fill="#B5472B" fill-opacity="0.2">N</text>
  </g>

</svg>
